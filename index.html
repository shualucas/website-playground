<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
      window.addEventListener("pageshow", () => window.scrollTo(0, 0));
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0f0f0" />
    <meta
      name="description"
      content="Selected product design work at Google. Previously, Blizzard Entertainment."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        document.documentElement.dataset.colorMode =
          localStorage.getItem("cartridge-color-mode") === "dark" ? "dark" : "light";
      } catch {}
    </script>
    <title>Joshua Lucas — Product Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/cartridge/main.jsx"></script>
  </body>
</html>
