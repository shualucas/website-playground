<!doctype html>
<html lang="en" data-color-mode="dark">
<head>
  <meta charset="UTF-8" />
    <script>
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
      window.addEventListener("pageshow", () => window.scrollTo(0, 0));
    </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Film photographs by Josh Lucas." />
  <meta name="theme-color" content="#0b0c0b" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
  <title>Josh Lucas — Product Designer</title>
  <script>
    try {
      document.documentElement.dataset.colorMode='dark';
      const entry=JSON.parse(sessionStorage.getItem('camera-entry')||'null');sessionStorage.removeItem('camera-entry');
      const navigation=performance.getEntriesByType('navigation')[0];
      if(entry&&Date.now()-entry.at>=0&&Date.now()-entry.at<10000&&navigation?.type!=='back_forward'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){window.__cameraEntry=entry;document.documentElement.dataset.cameraEntry='true';}
    }catch{}
  </script>
  <style>
    html{background:#0b0c0b}
    html[data-camera-entry="true"]::after{content:"";position:fixed;inset:0;background:white;z-index:100;pointer-events:none;animation:photo-flash-clear 1100ms 850ms ease-out both}
    html[data-camera-entry="true"][data-page-ready="true"]::after{animation:photo-flash-clear 1100ms ease-out both}
    @keyframes photo-flash-clear{to{opacity:0}}
    @media(prefers-reduced-motion:reduce){html::after{display:none}}
  </style>
</head>
<body><div id="root"></div><script type="module" src="/src/photos/main.jsx"></script></body>
</html>
