<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Film photographs by Josh Lucas." />
  <meta name="theme-color" content="#f0f0f0" />
  <link rel="icon" href="data:," />
  <title>josh lucas - product designer</title>
  <script>
    try {
      document.documentElement.dataset.colorMode=localStorage.getItem('cartridge-color-mode')==='dark'?'dark':'light';
      const entry=JSON.parse(sessionStorage.getItem('camera-entry')||'null');sessionStorage.removeItem('camera-entry');
      const navigation=performance.getEntriesByType('navigation')[0];
      if(entry&&Date.now()-entry.at>=0&&Date.now()-entry.at<10000&&navigation?.type!=='back_forward'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){window.__cameraEntry=entry;document.documentElement.dataset.cameraEntry='true';}
    }catch{}
  </script>
  <style>
    html[data-camera-entry="true"]::after{content:"";position:fixed;inset:0;background:white;z-index:100;pointer-events:none}
    html[data-camera-entry="true"][data-page-ready="true"]::after{animation:photo-flash-clear 420ms ease-out both}
    @keyframes photo-flash-clear{to{opacity:0}}
    @media(prefers-reduced-motion:reduce){html::after{display:none}}
  </style>
</head>
<body><div id="root"></div><script type="module" src="/src/photos/main.jsx"></script></body>
</html>
